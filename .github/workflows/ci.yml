name: CI

on:
  push:
    branches: [main, claude/integration]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  casino-lender:
    # playwright-core 1.56.1 supports Ubuntu 24.04, not ubuntu-latest's 26.04.
    runs-on: ubuntu-24.04
    container:
      image: mcr.microsoft.com/playwright:v1.56.1-noble@sha256:f1e7e01021efd65dd1a2c56064be399f3e4de00fd021ac561325f2bfbb2b837a
      options: --ipc=host
    defaults:
      run:
        shell: bash
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Verify bundled Chromium
        run: |
          node --experimental-strip-types --input-type=module <<'NODE'
          import { launchBrowser } from './scripts/ui-harness.mjs';
          const browser = await launchBrowser();
          try {
            const version = browser.version();
            if (version !== '141.0.7390.37') throw new Error(`Unexpected Chromium version: ${version}`);
            console.log(`Bundled Chromium ${version} started successfully.`);
          } finally {
            await browser.close();
          }
          NODE
      - name: Pages build (scratch output)
        run: node scripts/build-standalone.mjs --out /tmp/lender-pages --site-url /
      - name: Casino lender interactions
        run: node --experimental-strip-types scripts/verify-casino-lender-ui.mjs --pages /tmp/lender-pages --out /tmp/casino-lender --max-ms 1200000
      - name: Illustrated tavern cards
        run: node --experimental-strip-types scripts/verify-tavern-cards-ui.mjs --pages /tmp/lender-pages --out /tmp/tavern-cards
      - name: Friends community orders
        run: node --experimental-strip-types scripts/verify-community-orders-ui.mjs --pages /tmp/lender-pages --out /tmp/community-orders
      - name: Friend-hosted gatherings
        run: node --experimental-strip-types scripts/verify-friend-gatherings-ui.mjs --pages /tmp/lender-pages --out /tmp/friend-gatherings
      - name: Keep casino lender evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: casino-lender
          path: |
            /tmp/casino-lender
            /tmp/tavern-cards
            /tmp/community-orders
            /tmp/friend-gatherings

  village-life:
    # Real UI input against the isolated mock world: no production accounts,
    # network writes or saved data. Linux avoids local SwiftShader contention.
    # The suite outgrew one 20-minute run, so it runs as two shards in
    # parallel; together they list every step in verify-village-life-ui.mjs
    # (login-and-winter-world always runs first).
    runs-on: ubuntu-24.04
    container:
      image: mcr.microsoft.com/playwright:v1.56.1-noble@sha256:f1e7e01021efd65dd1a2c56064be399f3e4de00fd021ac561325f2bfbb2b837a
      options: --ipc=host
    defaults:
      run:
        shell: bash
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        shard:
          - name: town
            steps: pc-guidance-and-link,minimap-friends-museum-resize,museum-walk-and-open,salon-walk-and-customization,bank-deposit-withdraw-consent
          - name: outdoors
            steps: minimap-stays-folded,fruit-forage-chop,fishing-lock-cancel-resume,fishing-reel-fight
    name: village-life (${{ matrix.shard.name }})
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Verify bundled Chromium
        run: |
          node --experimental-strip-types --input-type=module <<'NODE'
          import { launchBrowser } from './scripts/ui-harness.mjs';
          const browser = await launchBrowser();
          try {
            const version = browser.version();
            if (version !== '141.0.7390.37') throw new Error(`Unexpected Chromium version: ${version}`);
            console.log(`Bundled Chromium ${version} started successfully.`);
          } finally {
            await browser.close();
          }
          NODE
      - name: Pages build (scratch output)
        run: node scripts/build-standalone.mjs --out /tmp/village-pages --site-url /
      - name: Village life interactions
        run: node --experimental-strip-types scripts/verify-village-life-ui.mjs --pages /tmp/village-pages --out /tmp/village-life --max-ms 1200000 --steps ${{ matrix.shard.steps }}
      - name: Keep village life evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: village-life-${{ matrix.shard.name }}
          path: /tmp/village-life

  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Type check
        run: npx tsc --noEmit
      - name: Tests
        run: npm test
      - name: Lint
        run: npm run lint
      - name: CSS token lint (zero tolerance; tokens in app/ui/tokens.css)
        run: npm run lint:css -- --ci --quiet
      - name: Pages build (scratch output, docs/ untouched)
        run: node scripts/build-standalone.mjs --out /tmp/pages
      - name: Build size summary
        run: |
          du -sh /tmp/pages /tmp/pages/assets
          ls -S -l /tmp/pages/assets/*.js /tmp/pages/assets/*.css | head -20

  ui-regression:
    # Screens at 1920×1080 and 1280×720 against a mocked cloud (never the real
    # Supabase): fails when contrast, small text, wrapping, clipping, HUD
    # overlap or covered controls get worse than scripts/ui-baseline.json.
    # Each viewport keeps its full strict capture list and baseline checks;
    # separate runners avoid serial captures approaching the job timeout.
    runs-on: ubuntu-24.04
    container:
      image: mcr.microsoft.com/playwright:v1.56.1-noble@sha256:f1e7e01021efd65dd1a2c56064be399f3e4de00fd021ac561325f2bfbb2b837a
      options: --ipc=host
    defaults:
      run:
        shell: bash
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        view: [fhd, s]
    name: ui-regression (${{ matrix.view }})
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Verify bundled Chromium
        run: |
          node --experimental-strip-types --input-type=module <<'NODE'
          import { launchBrowser } from './scripts/ui-harness.mjs';
          const browser = await launchBrowser();
          try {
            const version = browser.version();
            if (version !== '141.0.7390.37') throw new Error(`Unexpected Chromium version: ${version}`);
            console.log(`Bundled Chromium ${version} started successfully.`);
          } finally {
            await browser.close();
          }
          NODE
      - name: Pages build with the UI kit page
        run: UI_KIT=1 node scripts/build-standalone.mjs --out /tmp/pages --site-url /
      - name: UI regression (strict)
        run: npm run ui:shots -- --pages /tmp/pages --views ${{ matrix.view }} --out /tmp/ui-shots --baseline scripts/ui-baseline.json --strict
      - name: Keep the screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ui-shots-${{ matrix.view }}
          path: /tmp/ui-shots

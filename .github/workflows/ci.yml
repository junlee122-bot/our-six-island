name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  casino-lender:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Chromium for playwright-core
        run: npx playwright-core install --with-deps chromium
      - name: Pages build (scratch output)
        run: node scripts/build-standalone.mjs --out /tmp/lender-pages --site-url /
      - name: Casino lender interactions
        run: node --experimental-strip-types scripts/verify-casino-lender-ui.mjs --pages /tmp/lender-pages --out /tmp/casino-lender --max-ms 1200000
      - name: Illustrated tavern cards
        run: node --experimental-strip-types scripts/verify-tavern-cards-ui.mjs --pages /tmp/lender-pages --out /tmp/tavern-cards
      - name: Keep casino lender evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: casino-lender
          path: |
            /tmp/casino-lender
            /tmp/tavern-cards

  village-life:
    # Real UI input against the isolated mock world: no production accounts,
    # network writes or saved data. Linux avoids local SwiftShader contention.
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Chromium for playwright-core
        run: npx playwright-core install --with-deps chromium
      - name: Pages build (scratch output)
        run: node scripts/build-standalone.mjs --out /tmp/village-pages --site-url /
      - name: Village life interactions
        run: node --experimental-strip-types scripts/verify-village-life-ui.mjs --pages /tmp/village-pages --out /tmp/village-life --max-ms 1200000
      - name: Keep village life evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: village-life
          path: /tmp/village-life

  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Type check
        run: npx tsc --noEmit
      - name: Tests
        run: npm test
      - name: Lint
        run: npm run lint
      - name: CSS token lint (zero tolerance; tokens in app/ui/tokens.css)
        run: npm run lint:css -- --ci --quiet
      - name: Pages build (scratch output, docs/ untouched)
        run: node scripts/build-standalone.mjs --out /tmp/pages
      - name: Build size summary
        run: |
          du -sh /tmp/pages /tmp/pages/assets
          ls -S -l /tmp/pages/assets/*.js /tmp/pages/assets/*.css | head -20

  ui-regression:
    # Screens at 1920×1080 and 1280×720 against a mocked cloud (never the real
    # Supabase): fails when contrast, small text, wrapping, clipping, HUD
    # overlap or covered controls get worse than scripts/ui-baseline.json.
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Chromium for playwright-core
        run: npx playwright-core install --with-deps chromium
      - name: Pages build with the UI kit page
        run: UI_KIT=1 node scripts/build-standalone.mjs --out /tmp/pages --site-url /
      - name: UI regression (strict)
        run: npm run ui:shots -- --pages /tmp/pages --views fhd,s --out /tmp/ui-shots --baseline scripts/ui-baseline.json --strict
      - name: Keep the screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ui-shots
          path: /tmp/ui-shots
